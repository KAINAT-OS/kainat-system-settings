<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Gear mark -->
  <g fill="url(#gear)">
    <!-- Teeth -->
    <g id="teeth">
      <rect x="56" y="14" width="16" height="22" rx="4"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(45 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(90 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(135 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(180 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(225 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(270 64 64)"/>
      <rect x="56" y="14" width="16" height="22" rx="4" transform="rotate(315 64 64)"/>
    </g>
    <!-- Ring with center hole -->
    <path fill-rule="evenodd" d="M64 30a34 34 0 1 0 0.001 0Zm0 18a16 16 0 1 1 -0.001 0Z"/>
  </g>
</svg>
